name: Deploy

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: docker
    container:
      image: public.ecr.aws/y7p3h7o4/mkdocs-deploy:py3.13-mkdocs1.6.1-material9.7.7-v1
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - name: Checkout
        run: |
          git init .
          git -c http.extraHeader="Authorization: token ${{ github.token }}" \
            fetch --depth 1 \
            "${{ github.server_url }}/${{ github.repository }}.git" \
            "${{ github.sha }}"
          git checkout --detach FETCH_HEAD

      - name: Build
        run: python3 -m mkdocs build

      - name: Sync to S3
        run: |
          aws s3 sync ./site s3://filipelucas-notes
          aws s3 sync ./site s3://kb.techland42.com

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation --distribution-id EJU9GM7ZEVU6P --paths '/*'
          aws cloudfront create-invalidation --distribution-id E3D5O6ME0U6QCR --paths '/*'
